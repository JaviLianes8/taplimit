[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taplimit"
dynamic = ["version"]
description = "Small, typed, thread-safe in-process rate limiter: N calls per period, block or raise, sync or async, per key"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Javier Lianes", email = "javier@lianes8studio.com" }]
keywords = ["rate-limit", "ratelimit", "throttle", "decorator", "thread-safe", "sliding-window", "asyncio", "throttle-lines"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: AsyncIO",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
taplimit = "taplimit._cli:main"

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "build", "twine"]

[project.urls]
Homepage = "https://lianes8studio.com"
Source = "https://github.com/JaviLianes8/taplimit"
Issues = "https://github.com/JaviLianes8/taplimit/issues"
Changelog = "https://github.com/JaviLianes8/taplimit/blob/main/CHANGELOG.md"
LinkedIn = "https://www.linkedin.com/in/jlianes/"
Funding = "https://buymeacoffee.com/jlianesglrs"

[tool.hatch.version]
path = "src/taplimit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/taplimit"]

[tool.hatch.build.targets.sdist]
exclude = ["IMPROVEMENTS-round.md", "CERT-1.0-REPORT.md", "tests/sources/*.rst", "tests/sources/*.html", ".github"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
